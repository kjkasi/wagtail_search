{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Wagtail Bootstrap Search Demo{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'site/main.css' %}">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand" href="/">Wagtail demo</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavigation">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            {% for item in navigation_items %}
              <li class="nav-item"><a class="nav-link" href="{{ item.url }}">{{ item.title }}</a></li>
            {% endfor %}
          </ul>
          <form id="pageSearchForm" class="d-flex position-relative" role="search" action="{% url 'page-search' %}" method="get" autocomplete="off">
            <label class="visually-hidden" for="pageSearchInput">Search pages</label>
            <input id="pageSearchInput" class="form-control me-2" type="search" name="q" placeholder="Search" autocomplete="off" aria-controls="pageSearchResults" aria-expanded="false" aria-autocomplete="list">
            <div id="pageSearchResults" class="list-group position-absolute top-100 end-0 w-100 mt-1" role="listbox" aria-live="polite" hidden></div>
          </form>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>

    <script src="{% static 'site/main.js' %}"></script>
  </body>
</html>
