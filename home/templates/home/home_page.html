{% extends "home/base.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block content %}
  <h1>{{ page.title }}</h1>
  <p>Explore the editable sections below.</p>
  <div class="row g-3">
    {% for item in navigation_items %}
      <div class="col-md-4">
        <a class="card h-100 text-decoration-none" href="{{ item.url }}">
          <div class="card-body"><h2 class="h5 card-title">{{ item.title }}</h2></div>
        </a>
      </div>
    {% empty %}
      <p>No sections are available yet.</p>
    {% endfor %}
  </div>
{% endblock %}
