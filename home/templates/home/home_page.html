{% extends "home/base.html" %}
{% load wagtailcore_tags %}

{% block title %}{{ page.title }}{% endblock %}

{% block content %}
    <section class="mb-5">
        <h1 class="display-5">{{ page.title }}</h1>
        <div class="lead">{{ page.intro|richtext }}</div>
    </section>

    <section aria-labelledby="articles-heading">
        <h2 id="articles-heading" class="mb-4">Разделы</h2>
        <div class="row g-4">
            {% for item in navigation_items %}
                <div class="col-md-4">
                    <article class="card h-100 shadow-sm">
                        <div class="card-body">
                            <h3 class="card-title h5">{{ item.title }}</h3>
                            <a class="btn btn-primary" href="{% pageurl item %}">Открыть</a>
                        </div>
                    </article>
                </div>
            {% endfor %}
        </div>
    </section>
{% endblock %}
